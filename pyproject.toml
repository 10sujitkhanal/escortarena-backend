[project]
name = "velora-backend"
version = "0.1.0"
description = "Velora listings API (Django + DRF)"
readme = "README.md"
authors = [
    { name = "Sujit Khanal", email = "10sujitkhanal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "channels>=4.2",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "django>=5.2,<6",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "django-storages[s3]>=1.14",
    "djangorestframework>=3.18.3",
    "nh3>=0.2.20",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false
